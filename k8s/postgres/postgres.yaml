# PostgreSQL 16 : référentiels, commandes, agrégats. Schéma (postgres/init/01_schema.sql) publié
# dans la ConfigMap "postgres-init" par deploy.sh, exécuté au premier démarrage du volume.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: retailpulse
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: retailpulse}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: retailpulse
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: retailpulse}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: retailpulse}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          envFrom:
            - secretRef: {name: retailpulse-db}     # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}   # sous-dossier : volume pas forcément vide
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
