# Tableau de bord Streamlit, exposé hors du cluster par NodePort (port 30851).
# Avec minikube (driver docker sous Windows) : minikube service dashboard -n retailpulse
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: retailpulse
  labels: {app.kubernetes.io/name: dashboard, app.kubernetes.io/part-of: retailpulse}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: dashboard}
  ports:
    - {name: http, port: 8501, targetPort: 8501, nodePort: 30851}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: retailpulse
  labels: {app.kubernetes.io/name: dashboard, app.kubernetes.io/part-of: retailpulse}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: dashboard}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dashboard, app.kubernetes.io/part-of: retailpulse}
    spec:
      containers:
        - name: dashboard
          image: retailpulse-dashboard:1.0
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8501}
          envFrom:
            - configMapRef: {name: retailpulse-config}
            - secretRef: {name: retailpulse-db}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 30
            periodSeconds: 20
