name: retailpulse

# Un seul "docker compose up -d" lance toute la chaîne, dans cet ordre :
# kafka + postgres -> kafka-init (topics) -> producer (DummyJSON -> Kafka)
# -> consumer (Kafka -> PostgreSQL) -> simulator (commandes et paiements, en continu).

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: retailpulse-kafka
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Deux listeners : kafka:29092 entre conteneurs, localhost:9092 depuis l'hôte.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Un seul broker : replication factor 1 partout.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Les topics sont créés explicitement par kafka-init, jamais implicitement.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: retailpulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: retailpulse-postgres
    hostname: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la première création du volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # API Collector : DummyJSON -> retail-products / retail-customers
  producer:
    build: ./producer
    container_name: retailpulse-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DUMMYJSON_BASE_URL: https://dummyjson.com
      PAGE_SIZE: 50
    restart: "no"

  # Reference Loader : retail-products / retail-customers -> PostgreSQL (upsert)
  consumer:
    build: ./consumer
    container_name: retailpulse-consumer
    depends_on:
      producer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: "no"

  # Simulation commerciale continue : retail-orders / retail-order-events
  simulator:
    build: ./simulator
    container_name: retailpulse-simulator
    depends_on:
      consumer:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      INTERVAL_MIN: ${SIM_INTERVAL_MIN:-0.5}
      INTERVAL_MAX: ${SIM_INTERVAL_MAX:-2.0}
      FAILURE_RATE: ${SIM_FAILURE_RATE:-0.10}
      CANCEL_RATE: ${SIM_CANCEL_RATE:-0.05}
      MAX_ORDERS: ${SIM_MAX_ORDERS:-0}
    stop_grace_period: 20s   # laisse le temps du flush Kafka à l'arrêt
    restart: unless-stopped

volumes:
  kafka_data:
  pg_data:
